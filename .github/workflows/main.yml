name: Sync to Hugging Face Space
on:
  push:
    branches:
      - feature/model-v2

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Navigate to the engine folder
          cd ai_engine
          
          # Initialize a temporary repo for deployment
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploying AI Engine from Monorepo"
          
          # Push to Hugging Face (mapping local master to remote main)
          git remote add space https://Youseef-Awaad:$HF_TOKEN@huggingface.co/spaces/Youseef-Awaad/ZeroBite-ai-engine
          git push --force space master:main
